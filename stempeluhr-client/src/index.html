<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Stempeluhr</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- App-Icon (Issue #68): Quellen und Generator in icon-source/ -->
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#f4f7fb">
  <script>
    // Dunkles Kiosk-Design (Issue #39) noch VOR dem Bootstrap setzen: das
    // Grundgeruest (body-Hintergrund) steht sonst kurz hell da, bevor Angular
    // rendert. Die Regel fuer den Rest der Sitzung fuehrt die App selbst
    // (TerminalPage -> ThemeService.apply) - hier geht es nur um den ersten
    // Anstrich. Laeuft das auseinander, faerbt die App weiterhin korrekt ein;
    // es blitzt dann lediglich wieder hell auf.
    if (/\/terminal\/?$/.test(location.pathname)) {
      document.documentElement.dataset.theme = 'dark';
    }
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
