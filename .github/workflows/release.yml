name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "SemVer bump (empty = auto from commits)"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - patch
          - minor
          - major

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.next }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine last version
        id: last
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(gh release list --limit 100 --json tagName \
            -q '[.[].tagName | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))] | .[0]' 2>/dev/null || true)"
          if [ -z "$latest" ]; then
            latest="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -n 1)"
          fi
          echo "latest=${latest:-}" >> "$GITHUB_OUTPUT"

      - name: Determine bump type
        id: bump
        shell: bash
        env:
          BUMP_INPUT: ${{ inputs.bump }}
          LATEST_TAG: ${{ steps.last.outputs.latest }}
        run: |
          if [ -n "$BUMP_INPUT" ]; then
            echo "bump=$BUMP_INPUT" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          range="HEAD"
          [ -n "$LATEST_TAG" ] && range="${LATEST_TAG}..HEAD"

          log="$(git log --pretty=%s "$range")"

          if echo "$log" | grep -qiE '^[a-z]+(\([^)]*\))?!:|BREAKING CHANGE'; then
            echo "bump=major" >> "$GITHUB_OUTPUT"
          elif echo "$log" | grep -qE '^feat(\([^)]*\))?:'; then
            echo "bump=minor" >> "$GITHUB_OUTPUT"
          else
            echo "bump=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Calculate next version
        id: version
        shell: bash
        env:
          BUMP: ${{ steps.bump.outputs.bump }}
          LATEST_TAG: ${{ steps.last.outputs.latest }}
        run: |
          version="${LATEST_TAG#v}"
          [ -z "$version" ] && version="0.0.0"

          IFS='.' read -r major minor patch <<< "$version"

          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
            *) echo "Unsupported bump: $BUMP" >&2; exit 1 ;;
          esac

          next="$major.$minor.$patch"
          {
            echo "next=$next"
            echo "tag=v$next"
          } >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        shell: bash
        env:
          LATEST_TAG: ${{ steps.last.outputs.latest }}
          NEXT_TAG: ${{ steps.version.outputs.tag }}
        run: |
          range="HEAD"
          header="## What's Changed"
          [ -n "$LATEST_TAG" ] && range="${LATEST_TAG}..HEAD"
          [ -z "$LATEST_TAG" ] && header="## First Release"

          subjects="$(git log --pretty=%s "$range")"
          merges="$(git log --merges --pretty='- %s' "$range" | sed -E 's/- Merge pull request #([0-9]+) from [^/]+\/[^[:space:]]+/- #\1/')"

          notes="$header"
          for pair in "Breaking Changes ^[a-z]+(\[[^]]*\])?(\([^)]*\))!" "Features feat(\([^)]*\))?" "Bug Fixes (fix|fix\+test)(\([^)]*\))?" "Performance perf(\([^)]*\))?"; do
            # ${pair% *} = alles bis zum letzten Wort (Titel), ${pair##* } = letztes Wort (Regex).
            # read -r title pattern wuerde bei Titeln mit Leerzeichen ("Bug Fixes") zerbrechen.
            title="${pair% *}"
            pattern="${pair##* }"
            body="$(echo "$subjects" | { grep -iE "${pattern}:" || true; } | sed -E 's/^[a-z]+(\+test)?(\([^)]*\))?!?: */- /')"
            if [ -n "$body" ]; then
              notes+=$'\n\n### '"$title"$'\n'"$body"
            fi
          done
          other="$(echo "$subjects" | { grep -viE '^(feat|fix|perf)(\([^)]*\))?:' || true; } | { grep -v '^Merge pull request #' || true; } | sed 's/^/- /')"
          if [ -n "$other" ]; then
            notes+=$'\n\n### Other\n'"$other"
          fi
          if [ -n "$merges" ]; then
            notes+=$'\n\n### Pull Requests\n'"$merges"
          fi
          if [ "$(echo "$notes" | wc -l)" -le 1 ]; then
            notes+=$'\n\n- No notable changes.'
          fi
          notes+="$(printf '\n\n**Full Changelog**: https://github.com/%s/compare/%s...%s' "$GITHUB_REPOSITORY" "${LATEST_TAG:-$(git rev-list --max-parents=0 HEAD | head -n 1)}" "$NEXT_TAG")"

          file="$(mktemp)"
          printf '%s\n' "$notes" > "$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"
          cat "$file"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          TITLE: ${{ steps.version.outputs.tag }}
          NOTES_FILE: ${{ steps.changelog.outputs.file }}
        run: gh release create "$TAG" --target "$GITHUB_SHA" --title "$TITLE" --notes-file "$NOTES_FILE"

      - name: Attach pi-nfc-agent ZIP to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Zentrales Deploy-Artefakt fuer die Pi-Clients (tools/deploy/pi-deploy.sh):
          # eine Quelle pro Version, kein manuelles ZIP-Bauen mehr.
          cd tools/pi-nfc-agent
          zip -j "pi-nfc-agent-${TAG}.zip" stempeluhr_nfc_agent.py offline_queue.py config.example.json
          # --clobber: Idempotenz — nach einem fehlgeschlagenen Upload (Release
          # existiert dann schon) kann der Job re-runt werden, ohne dass
          # "gh release create" am existierenden Tag scheitert.
          gh release upload "$TAG" "pi-nfc-agent-${TAG}.zip" --clobber

      - name: Summary
        shell: bash
        env:
          LATEST_TAG: ${{ steps.last.outputs.latest }}
          TAG: ${{ steps.version.outputs.tag }}
          BUMP: ${{ steps.bump.outputs.bump }}
        run: |
          {
            echo "## Release created"
            echo ""
            echo "- Previous: ${LATEST_TAG:-none}"
            echo "- Released: $TAG"
            echo "- Bump: $BUMP"
          } >> "$GITHUB_STEP_SUMMARY"

  container:
    runs-on: ubuntu-latest
    needs: release

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Normalize image name
        id: image
        shell: bash
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker tags
        id: tags
        shell: bash
        run: |
          # workflow_dispatch liefert github.ref=refs/heads/main - die semver-
          # Filter von docker/metadata-action greifen dann nie (nur "latest").
          # Tags deshalb explizit aus der Release-Version bauen (X.Y.Z, X.Y).
          version="${{ needs.release.outputs.version }}"
          major_minor="${version%.*}"
          image="${{ env.REGISTRY }}/${{ steps.image.outputs.name }}"
          echo "tags=${image}:${version},${image}:${major_minor},${image}:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ needs.release.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}

  # Einmaliger Retry des Container-Builds bei Fehlern (z.B. transiente
  # GHCR-Fehler wie "unknown blob"). Läuft als eigener Job nach Abschluss
  # des ersten Container-Jobs — gh run rerun innerhalb eines laufenden
  # Runs würde von der API abgelehnt.
  container-retry:
    runs-on: ubuntu-latest
    needs: [release, container]
    if: failure() && needs.release.result == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Normalize image name
        id: image
        shell: bash
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker tags
        id: tags
        shell: bash
        run: |
          # workflow_dispatch liefert github.ref=refs/heads/main - die semver-
          # Filter von docker/metadata-action greifen dann nie (nur "latest").
          # Tags deshalb explizit aus der Release-Version bauen (X.Y.Z, X.Y).
          version="${{ needs.release.outputs.version }}"
          major_minor="${version%.*}"
          image="${{ env.REGISTRY }}/${{ steps.image.outputs.name }}"
          echo "tags=${image}:${version},${image}:${major_minor},${image}:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push (retry)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ needs.release.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
