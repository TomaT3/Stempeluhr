name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: API build + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build API
        run: dotnet build Stempeluhr.Api/Stempeluhr.Api.csproj -v q

      - name: Run unit tests
        run: dotnet test Stempeluhr.Api.Tests/Stempeluhr.Api.Tests.csproj -v minimal --logger "console;verbosity=normal"

  client-build:
    name: Angular build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: stempeluhr-client
        run: npm ci

      - name: Production build
        working-directory: stempeluhr-client
        run: npx ng build --configuration production

      - name: Unit tests
        working-directory: stempeluhr-client
        run: npx ng test --watch=false

  e2e-offline:
    name: E2E offline integration test
    runs-on: ubuntu-latest
    needs: [api-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run offline integration tests (Fake-Kimai + real API)
        run: bash tools/testenv/run_e2e_test.sh
